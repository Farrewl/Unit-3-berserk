general {
    ignore_systemd_inhibit = false
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = false
    lock_cmd = ~/.config/quickshell/lock.sh
    before_sleep_cmd = ~/.config/quickshell/lock.sh
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3 minutes idle: lock the session.
listener {
    timeout = 180
    on-timeout = ~/.config/quickshell/lock.sh
}

# A few seconds after locking, turn the display off.
# Keyboard or mouse input wakes it back up and shows the lockscreen.
listener {
    timeout = 185
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
