# ── NieR:Automata Terminal — Kitty Config ──

# Font
font_family      Share Tech Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Spacing
letter_spacing   0.5
line_height      1.2

# Sepia NieR palette
foreground            #EBE3D1
background            #14100B
selection_foreground  #14100B
selection_background  #EBE3D1

# Cursor
cursor                #8C1A16
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_text_color     #14100B
cursor_shape          block
cursor_blink_interval 0.8

# ANSI colors — sepia/dark palette
color0  #14100B
color1  #8C1A16
color2  #7A6E52
color3  #C5A253
color4  #5A6068
color5  #6E4A52
color6  #52625E
color7  #EBE3D1
color8  #1D1913
color9  #B42E28
color10 #857B66
color11 #C5A253
color12 #6A7A84
color13 #8A5E72
color14 #5E7A78
color15 #EBE3D1

# Window
window_padding_width     20
background_opacity       0.92
dynamic_background_color no

# Scrollback
scrollback_lines 5000

# Tabs — hidden (minimal)
tab_bar_style hidden

# No bell
enable_audio_bell no
visual_bell_duration 0.0

# Url
url_color   #C5A253
url_style   single

# Minimal window title
title_template "{title}"
