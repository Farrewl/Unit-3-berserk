# ── NieR:Automata Terminal — Kitty Config ──

# Font
font_family      Share Tech Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Spacing
letter_spacing   0.5
line_height      1.2

# Sepia NieR palette
foreground            #E0DBCA
background            #14100B
selection_foreground  #14100B
selection_background  #E0DBCA

# Cursor
cursor                #8B1A1A
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_text_color     #14100B
cursor_shape          block
cursor_blink_interval 0.8

# ANSI colors — sepia/dark palette
color0  #14100B
color1  #8B1A1A
color2  #7A6E52
color3  #C2A25A
color4  #5A6068
color5  #6E4A52
color6  #52625E
color7  #E0DBCA
color8  #2E2822
color9  #B03A34
color10 #8A7E62
color11 #B8A86A
color12 #6A7A84
color13 #8A5E72
color14 #5E7A78
color15 #EEE8DB

# Window
window_padding_width     20
background_opacity       0.92
dynamic_background_color no

# Scrollback
scrollback_lines 5000

# Tabs — hidden (minimal)
tab_bar_style hidden

# No bell
enable_audio_bell no
visual_bell_duration 0.0

# Url
url_color   #C2A25A
url_style   single

# Minimal window title
title_template "{title}"
